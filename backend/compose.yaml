# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
    env_file:
      - .env
    ports:
      - 9000:4000
    volumes:
      - exports_data:/usr/src/app/exports
      # Bind-mounted (not a named volume) so files written by a seed
      # script run on the host (npm run seed:apps, straight on your Mac)
      # land in the exact same place the running server reads uploads
      # from - without this, the host's ./uploads and the container's own
      # /usr/src/app/uploads are two unrelated directories that silently
      # drift apart, which is exactly what caused the 404s: rows in the
      # (correctly shared) database pointing at files that only existed
      # on one side.
      - ./uploads:/usr/src/app/uploads

    depends_on:
      - postgres
      - redis
      - opensearch
  postgres:
    image: postgres:18
    container_name: my-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: Sethupathi
      POSTGRES_PASSWORD: 123123
      POSTGRES_DB: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  
  redis:
    image: redis:7-alpine
    container_name: my-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: my-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"   # dev only - see the note at the bottom
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Playstore@2026"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  postgres_data:
  redis_data:
  exports_data:
  opensearch_data:


